# Logging of the language server (sqrl lsp). stdout carries the protocol, so all logs go to stderr,
# which editors show in the language server's output log.
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d [%t] %-5level %c - %m%n

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = Console

logger.datasqrl.name = com.datasqrl
logger.datasqrl.level = INFO
logger.datasqrl.appenderRef.console.ref = Console
logger.datasqrl.additivity = false

logger.hadoopUtils.name = org.apache.flink.runtime.util.HadoopUtils
logger.hadoopUtils.level = ERROR
logger.hadoopNativeCode.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoopNativeCode.level = ERROR
