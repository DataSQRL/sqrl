# A contract with a map and a timestamp, which ODCS has types for since v3.2 and v3.1
apiVersion: v3.2.0
kind: DataContract
id: urn:catalog:legacy
version: 1.0.0
status: active
schema:
  - name: Events
    properties:
      - name: id
        logicalType: integer
        required: true
      - name: kind
        logicalType: string
        required: true
      - name: payload
        logicalType: map
        map:
          key:
            logicalType: string
          value:
            logicalType: string
      - name: created_at
        logicalType: timestamp
        required: true
