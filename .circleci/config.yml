version: 2.1

job-defaults: &job-defaults
  context: datasqrl
  filters:
    branches:
      only: /.*/
    tags:
      only: /.*/

orbs:
  docker: circleci/docker@2.2.0

executors:
  default-machine:
    machine:
      image: ubuntu-2404:current
      resource_class: large

commands:
  skip-if-docs-only:
    description: "Halt the job when the changeset only touches documentation/"
    steps:
      - run:
          name: Skip if only documentation changed
          command: |
            # On tags we always build
            if [ -n "$CIRCLE_TAG" ]; then
              echo "Tagged build – proceeding."
              exit 0
            fi

            BASE_BRANCH="origin/main"
            git fetch --depth=50 origin main 2>/dev/null || true

            # Determine changed files relative to main (or parent commit on main)
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FORCE_BUILD")
            else
              MERGE_BASE=$(git merge-base "$BASE_BRANCH" HEAD 2>/dev/null || echo "")
              if [ -z "$MERGE_BASE" ]; then
                echo "Cannot determine merge-base – proceeding with build."
                exit 0
              fi
              CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD)
            fi

            # If every changed file is under documentation/, skip
            NON_DOC=$(echo "$CHANGED" | grep -v '^documentation/' || true)
            if [ -z "$NON_DOC" ]; then
              echo "Only documentation/ files changed – skipping this job."
              circleci step halt
            else
              echo "Non-documentation changes detected – proceeding."
            fi

  generate-settings:
    description: "Generate Maven settings.xml with GitHub credentials"
    steps:
      - run:
          name: Generate settings.xml
          command: |
            mkdir -p ~/.m2
            cat \<<EOF > ~/.m2/settings.xml
            <settings>
              <servers>
                <server>
                  <id>github</id>
                  <username>${GITHUB_USER}</username>
                  <password>${GITHUB_TOKEN}</password>
                </server>
                <server>
                  <id>central</id>
                  <username>${CENTRAL_USER}</username>
                  <password>${CENTRAL_PASSWORD}</password>
                </server>
              </servers>
            </settings>
            EOF

  install-jdk:
    description: "Provision Eclipse Temurin 17"
    steps:
      - run:
          name: Provision Eclipse Temurin 17
          command: |
            JDK_IMAGE=eclipse-temurin:17-jdk-noble@sha256:30df3b90dc99b30e663c44e74c42f0a942360718b189558e1fe6692504c69a17
            JAVA_HOME="$HOME/.jdk/temurin-17"
            JDK_CONTAINER="temurin-jdk-$$"

            trap 'docker rm -f "$JDK_CONTAINER" >/dev/null 2>&1 || true' EXIT
            docker create --name "$JDK_CONTAINER" "$JDK_IMAGE" >/dev/null
            rm -rf "$JAVA_HOME"
            mkdir -p "$JAVA_HOME"
            docker cp "$JDK_CONTAINER:/opt/java/openjdk/." "$JAVA_HOME"
            docker rm "$JDK_CONTAINER" >/dev/null
            trap - EXIT

            echo "export JAVA_HOME=$JAVA_HOME" >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            export JAVA_HOME
            export PATH="$JAVA_HOME/bin:$PATH"
            java -version
            javac -version

  configure-jacoco:
    description: "Set the JaCoCo runtime agent path for CI coverage runs"
    steps:
      - run:
          name: Configure JaCoCo
          command: |
            JACOCO_VERSION=$(sed -n 's:.*<jacoco.version>\([^<]*\)</jacoco.version>.*:\1:p' pom.xml | head -n 1)
            if [ -z "$JACOCO_VERSION" ]; then
              echo "Failed to determine jacoco.version from pom.xml" >&2
              exit 1
            fi
            echo "export JACOCO_AGENT_PATH=$HOME/.m2/repository/org/jacoco/org.jacoco.agent/$JACOCO_VERSION/org.jacoco.agent-$JACOCO_VERSION-runtime.jar" >> "$BASH_ENV"

  determine-version:
    description: "Derive TAG_SUFFIX and REGISTRY"
    steps:
      - run:
          name: Determine Docker tag & registry
          command: |
            set -x
            # helper to extract the first PR number, if any
            get_pr_number() {
              if [ -n "${CIRCLE_PR_NUMBER:-}" ]; then
                echo "$CIRCLE_PR_NUMBER"
              elif [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
                basename "$CIRCLE_PULL_REQUEST"
              elif [ -n "${CIRCLE_PULL_REQUESTS:-}" ]; then
                echo "$CIRCLE_PULL_REQUESTS" | cut -d',' -f1 | xargs basename
              fi
            }

            PR_NUM=$(get_pr_number)

            # default: do not create :latest tags
            echo "export LATEST_TAG=false" >> "$BASH_ENV"

            if [ -n "$PR_NUM" ]; then
              echo "export TAG_SUFFIX=pr-$PR_NUM"      >> "$BASH_ENV"
              echo "export REGISTRY=ghcr.io/datasqrl"  >> "$BASH_ENV"
              echo "export IS_RELEASE=false"           >> "$BASH_ENV"
            elif [ -n "$CIRCLE_TAG" ]; then
              echo "export TAG_SUFFIX=$CIRCLE_TAG"     >> "$BASH_ENV"
              echo "export REGISTRY=datasqrl"          >> "$BASH_ENV"
              echo "export IS_RELEASE=true"            >> "$BASH_ENV"

              # Only tag :latest for stable SemVer releases (no pre-release suffix)
              if [[ "$CIRCLE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "export LATEST_TAG=true"          >> "$BASH_ENV"
              fi
            elif [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "export TAG_SUFFIX=dev"             >> "$BASH_ENV"
              echo "export REGISTRY=datasqrl"          >> "$BASH_ENV"
              echo "export IS_RELEASE=false"           >> "$BASH_ENV"
            elif [[ "$CIRCLE_BRANCH" =~ ^release-([0-9]+\.[0-9]+)$ ]]; then
              # release-0.12 publishes ghcr.io/datasqrl/*:0.12-dev
              echo "export TAG_SUFFIX=${BASH_REMATCH[1]}-dev" >> "$BASH_ENV"
              echo "export REGISTRY=ghcr.io/datasqrl"         >> "$BASH_ENV"
              echo "export IS_RELEASE=false"                  >> "$BASH_ENV"
            else
              echo "export TAG_SUFFIX=$CIRCLE_BRANCH"  >> "$BASH_ENV"
              echo "export REGISTRY=ghcr.io/datasqrl"  >> "$BASH_ENV"
              echo "export IS_RELEASE=false"           >> "$BASH_ENV"
            fi

  download-dependencies:
    description: "Download Maven dependencies"
    steps:
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
      - run:
          name: Check if cache was restored
          command: |
            if [ -d ~/.m2/repository/de/qaware ]; then
              echo "Cache hit detected, skipping resolve job."
              circleci step halt
            else
              echo "No cache hit, proceeding with resolve."
            fi
      - run:
          name: Download dependencies
          command: |
            mvn -B -Pdev \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:go-offline \
              de.qaware.maven:go-offline-maven-plugin:1.2.8:resolve-dependencies \
              -T3

  save-test-results:
    description: "Save test results and upload to Codecov"
    steps:
      - run:
          name: Save package results
          command: |
            mkdir -p ~/test-results/junit/
            find . -type f \( \
                -regex ".*/target/surefire-reports/.*xml" \
                -o -regex ".*/target/failsafe-reports/.*xml" \
              \) \
              -exec cp {} ~/test-results/junit/ \;
          when: always
      - store_test_results:
          path: ~/test-results
      - run:
          name: Codecov
          command: |
            set -x
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov

            # Prepare extra arguments: include pull request number if set
            EXTRA=""
            if [ -n "$CIRCLE_PR_NUMBER" ]; then
              EXTRA="--pull-request-number $CIRCLE_PR_NUMBER"
            fi

            # Build the set of common arguments.
            COMMON_ARGS="--token $CODECOV_TOKEN --branch $CIRCLE_BRANCH --commit-sha $CIRCLE_SHA1 $EXTRA --recurse-submodules --git-service github"

            ls -lha

            ./codecov --version

            INTEGRATION_COVERAGE=sqrl-testing/sqrl-testing-integration/target/site/jacoco-aggregate/jacoco.xml
            if [ -f "$INTEGRATION_COVERAGE" ]; then
              ./codecov upload-coverage \
                --file "$INTEGRATION_COVERAGE" \
                --flag integration \
                --name "integration-${TEST_SHARDING_INDEX:-0}" \
                $COMMON_ARGS
            else
              # Unit-test jobs have per-module JaCoCo reports instead of an aggregate report.
              ./codecov upload-coverage $COMMON_ARGS
            fi

            # Upload the test reports.
            ./codecov do-upload --report-type test_results $COMMON_ARGS

  upload-container-coverage:
    description: "Upload container E2E JaCoCo coverage to Codecov"
    steps:
      - run:
          name: Codecov container coverage
          command: |
            curl -Os https://cli.codecov.io/latest/linux/codecov
            chmod +x codecov

            EXTRA=""
            if [ -n "$CIRCLE_PR_NUMBER" ]; then
              EXTRA="--pull-request-number $CIRCLE_PR_NUMBER"
            fi

            COMMON_ARGS="--token $CODECOV_TOKEN --branch $CIRCLE_BRANCH --commit-sha $CIRCLE_SHA1 $EXTRA --recurse-submodules --git-service github"
            ./codecov upload-coverage \
              --file sqrl-testing/sqrl-testing-container/target/site/jacoco-aggregate/jacoco.xml \
              --flag container-e2e \
              --name "container-e2e-${CIRCLE_NODE_INDEX}" \
              $COMMON_ARGS
          when: always

  compute-sha1-tags:
    description: "Compute deterministic tags from Dockerfiles"
    steps:
      - run:
          name: Compute Docker image tags
          command: |
            DUCKDB_JDBC_VERSION=$(sed -n 's:.*<duckdb.version>\([^<]*\)</duckdb.version>.*:\1:p' pom.xml | head -n 1)
            if [ -z "$DUCKDB_JDBC_VERSION" ]; then
              echo "Failed to determine duckdb.version from pom.xml" >&2
              exit 1
            fi
            echo "export DUCKDB_JDBC_VERSION=${DUCKDB_JDBC_VERSION}" >> "$BASH_ENV"

            compute_sha1_tag_with_salt() {
              local var_name="$1"
              local salt="$2"
              shift 2
              local tag=$( (sha1sum "$@"; printf '%s' "$salt") | sha1sum | cut -c1-12)
              echo "Computed ${var_name}=${tag}"
              echo "export ${var_name}=${tag}" >> "$BASH_ENV"
            }

            compute_sha1_tag_with_salt "DUCKDB_EXTENSIONS_TAG" "$DUCKDB_JDBC_VERSION" "Dockerfile.duckdb-extensions"
            compute_sha1_tag_with_salt "BASE_TAG" "$DUCKDB_JDBC_VERSION" "sqrl-cli/Dockerfile.base" "Dockerfile.duckdb-extensions"

  compute-mcp-tag:
    description: "Compute MCP_TAG from latest @modelcontextprotocol/inspector version"
    steps:
      - run:
          name: Compute MCP_TAG
          command: |
            # Install Node.js and npm if not available
            if ! command -v npm &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            
            # Fetch the latest version of @modelcontextprotocol/inspector
            MCP_VERSION=$(npm view @modelcontextprotocol/inspector version)
            echo "Latest MCP inspector version: ${MCP_VERSION}"
            
            # Compute hash of Dockerfile.mcp-inspector
            DOCKERFILE_HASH=$(sha1sum Dockerfile.mcp-inspector | cut -c1-12)
            echo "Dockerfile.mcp-inspector hash: ${DOCKERFILE_HASH}"
            
            # Combine version and dockerfile hash for the tag
            MCP_TAG="${MCP_VERSION}-${DOCKERFILE_HASH}"
            echo "Combined MCP_TAG: ${MCP_TAG}"
            echo "export MCP_TAG=${MCP_TAG}" >> "$BASH_ENV"

  setup-buildx:
    description: "Enable QEMU for ARM build and install Docker buildx"
    parameters:
      builder_name:
        type: string
        default: "default-builder"
      arch:
        type: enum
        enum: ["amd64", "arm64"]
        default: "amd64"
      qemu:
        type: boolean
        default: true
    steps:
      - when:
          condition: << parameters.qemu >>
          steps:
            - run:
                name: Enable QEMU for ARM build
                command: |
                  sudo apt-get update && sudo apt-get install -y qemu-user-static binfmt-support
                  docker run --privileged --rm tonistiigi/binfmt --install all
      - run:
          name: Install docker buildx
          command: |
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            curl -sSL https://github.com/docker/buildx/releases/download/v0.12.0/buildx-v0.12.0.linux-<< parameters.arch >> \
                 -o buildx
            chmod +x buildx
            sudo mv buildx /usr/local/lib/docker/cli-plugins/docker-buildx
            docker buildx create --use --name << parameters.builder_name >>
            docker buildx inspect --bootstrap

  skip-if-base-image-exists:
    steps:
      - run:
          name: Skip build if base already exists
          command: |
            set +e

            if docker buildx imagetools inspect ghcr.io/datasqrl/sqrl-base:${BASE_TAG} \
                --format '{{json .}}' > /tmp/manifest.json 2>/dev/null; then
              echo "── Manifest for ghcr.io/datasqrl/sqrl-base:${BASE_TAG} ────────────────"
              cat /tmp/manifest.json | jq .
              echo "───────────────────────────────────────────────────────────────"
              echo "Tag already exists – skipping base-image build."
              circleci step halt
            else
              echo "Tag does not exist yet – will build base image."
            fi

  skip-unpublished-images:
    steps:
      - run:
          name: Skip image generation
          command: |
            set -x

            # Push to Docker Hub for tagged releases (datasqrl/*) and main=:dev (datasqrl/*).
            # Tagged releases are also mirrored to ghcr.io/datasqrl/* so downstream can pull
            # without hitting Docker Hub rate limits.
            # Push PR images to ghcr.io/datasqrl/* so downstream CI (e.g. datasqrl-examples) can
            # validate examples against the snapshot built from this PR.
            # Push release branch images to ghcr.io/datasqrl/* as <major>.<minor>-dev (release-0.12=:0.12-dev).
            if [ "$IS_RELEASE" != "true" ] && [ "$TAG_SUFFIX" != "dev" ] && [[ "$TAG_SUFFIX" != pr-* ]] \
                && ! [[ "$TAG_SUFFIX" =~ ^[0-9]+\.[0-9]+-dev$ ]]; then
              echo "Skipping image publishing for TAG_SUFFIX=$TAG_SUFFIX (only tagged releases, main=:dev, release-X.Y=:X.Y-dev, and pr-* are published)."
              circleci step halt
            fi

  login-to-registries:
    steps:
      - run:
          name: Login to registries
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  checkout-and-version:
    steps:
      - checkout
      - run:
          name: Set version if tagged release
          command: |
            env
            if [ -n "$CIRCLE_TAG" ]; then
              echo "Setting Maven version to $CIRCLE_TAG"
              mvn -B versions:set -DnewVersion=$CIRCLE_TAG
            fi

jobs:
  download-maven-dependencies:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout-and-version
      - skip-if-docs-only
      - generate-settings
      - download-dependencies
      - save_cache:
          key: m2-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2

  unit-tests:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout-and-version
      - skip-if-docs-only
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
      - generate-settings
      - configure-jacoco
      - run:
          name: Run Unit Tests
          command: |
            export MAVEN_OPTS="-Xmx3g -XX:MaxMetaspaceSize=768m -Djava.awt.headless=true"
            mvn -U -T1 -B install \
            -DonlyUTs -Dcoverage -Djacoco.agent.path="$JACOCO_AGENT_PATH" \
            -DargLine="@{argLine} -Xmx2g -XX:MaxMetaspaceSize=512m"
      - save-test-results

  integration-tests:
    executor: default-machine
    parameters:
      test_sharding_total:
        type: integer
      test_sharding_index:
        type: integer
    environment:
      TEST_SHARDING_TOTAL: << parameters.test_sharding_total >>
      TEST_SHARDING_INDEX:  << parameters.test_sharding_index >>
    steps:
      - checkout-and-version
      - skip-if-docs-only
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
      - generate-settings
      - install-jdk
      - configure-jacoco
      - run:
          name: Run Integration Tests
          command: |
            mvn -U -T2 -B install -DonlyITs -Dcoverage -Djacoco.agent.path="$JACOCO_AGENT_PATH"
            mvn -B -DonlyITs -Dcoverage -Djacoco.aggregate jacoco:report-aggregate
      - save-test-results

  container-e2e-test:
    executor: default-machine
    parallelism: 2
    steps:
      - checkout-and-version
      - skip-if-docs-only
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
      - generate-settings
      - install-jdk
      - configure-jacoco
      - compute-mcp-tag
      - compute-sha1-tags
      - run:
          name: Auth ghcr
          command: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin
      - run:
          name: Build with Docker images
          command: >-
            mvn -U clean -T1C -B install -DonlyImages
            -Ddocker.image.tag=local-${CIRCLE_SHA1}
            -Ddocker.image.repo=ghcr.io/datasqrl
            -Ddocker.image.base.tag=${BASE_TAG}
            -Ddocker.image.duckdb.tag=${DUCKDB_EXTENSIONS_TAG}
      - run:
          name: Run container tests using TestContainers
          command: |
            SHARD_TESTS=$(circleci tests glob "sqrl-testing/sqrl-testing-container/src/test/java/**/*IT.java" \
              | sed 's|.*/src/test/java/||; s|/|.|g; s|\.java$||' \
              | circleci tests split --split-by=timings --timings-type=classname \
              | sed 's|.*\.||' \
              | paste -sd,)
            echo "Running shard ${CIRCLE_NODE_INDEX}: $SHARD_TESTS"
            mvn -B install -DonlyContainerE2E -Dcoverage -Djacoco.agent.path="$JACOCO_AGENT_PATH" \
              -pl :sqrl-testing-container \
              -Dit.test="$SHARD_TESTS" \
              -Ddocker.image.tag=local-${CIRCLE_SHA1} \
              -Dmcp.inspector.version=$MCP_TAG
            mvn -B -DonlyContainerE2E -Dcoverage -Djacoco.aggregate jacoco:report-aggregate
      - run:
          name: Collect test results
          command: |
            mkdir -p ~/test-results/container-${CIRCLE_NODE_INDEX}/
            find sqrl-testing/sqrl-testing-container/target/failsafe-reports -name "TEST-*.xml" \
              -exec cp {} ~/test-results/container-${CIRCLE_NODE_INDEX}/ \;
          when: always
      - store_test_results:
          path: ~/test-results
          when: always
      - upload-container-coverage

  deploy:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout-and-version
      - skip-if-docs-only
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
      - generate-settings
      - run:
          name: Import GPG Key
          command: |
            echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
            echo "default-key $(gpg --list-keys --with-colons | grep pub | cut -d':' -f5)" >> ~/.gnupg/gpg.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
      - run:
          name: Deploy Maven artifacts
          command: |
            # GitHub Packages intermittently fails uploads with HTTP 5xx.
            # Upload each module's files sequentially and retry those errors too (Resolver only retries 429 and 503 by default).
            # A 5xx can still store the file, and GitHub answers the retried upload with 409 because files can't be overwritten.
            deploy_to_github_packages() {
              mvn -T1C -B "$@" deploy \
                -Daether.connector.basic.parallelPut=false \
                -Daether.transport.http.retryHandler.count=5 \
                -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504
            }

            if [ -n "$CIRCLE_TAG" ]; then
              # Releases also go to GitHub Packages, so they can be resolved when Maven Central rejects them (it caps what the
              # com.datasqrl namespace publishes per month). Only the github-release profile gives them a repository there.
              # It uploads at the end of the build, one file at a time in reactor order, and the last module's test jar is
              # the last file. So a re-run skips the deploy once that is there, instead of failing because GitHub rejects
              # re-uploading a release's files with 409.
              GITHUB_STATUS=0
              LAST=sqrl-testing-integration
              if curl -sfLo /dev/null -u "$GITHUB_USER:$GITHUB_TOKEN" \
                  "https://maven.pkg.github.com/DataSQRL/sqrl/com/datasqrl/$LAST/$CIRCLE_TAG/$LAST-$CIRCLE_TAG-tests.jar"; then
                echo "$CIRCLE_TAG is already on GitHub Packages, skipping its deploy"
              else
                deploy_to_github_packages -U clean -Pgithub-release || GITHUB_STATUS=$?
              fi

              # Also runs when only the GitHub Packages deploy failed, so one repository failing doesn't hold back the other.
              # Maven Central gets a single bundle through the central-publishing-maven-plugin.
              mvn -U clean -T1C -B deploy -Pcentral-release
              exit $GITHUB_STATUS
            fi

            # Snapshots only go to GitHub Packages.
            # A new Maven run deploys under a new snapshot timestamp, so resume from the failed module when the deploy fails.
            set -o pipefail
            LOG=$(mktemp)
            ARGS="-U clean"
            for ATTEMPT in 1 2 3; do
              if deploy_to_github_packages $ARGS -DonlyJars 2>&1 | tee "$LOG"; then
                exit 0
              fi
              # Build failures are not retried, only failed uploads
              grep -q 'Failed to execute goal org.apache.maven.plugins:maven-deploy-plugin' "$LOG" || exit 1
              RESUME=$(grep -oE -- '-rf :[^[:space:]]+' "$LOG" | tail -n 1 | cut -d' ' -f2)
              [ -n "$RESUME" ] || exit 1
              echo "Deploy attempt $ATTEMPT of 3 failed in $RESUME"
              ARGS="-rf $RESUME"
            done
            exit 1

  build-images-platform:
    parameters:
      arch:
        type: enum
        enum: ["amd64", "arm64"]
      resource_class:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    steps:
      - checkout-and-version
      - skip-if-docs-only
      - determine-version
      - skip-unpublished-images
      - run:
          name: Checkout stdlib-docs at the Flink SQL Runner version
          # The core-agent image bundles the generated docs, which include the function docs
          command: documentation/scripts/checkout-stdlib-docs.sh
      - restore_cache:
          keys:
            - m2-{{ checksum "pom.xml" }}
      - generate-settings
      - install-jdk

      - run:
          name: Build shaded JARs
          command: mvn -U -T1C -B install -DonlyJars

      - determine-version
      - compute-sha1-tags
      - setup-buildx:
          builder_name: "sqrl-builder"
          arch: << parameters.arch >>
          qemu: false

      - login-to-registries

      - run:
          name: Pull base images
          command: |
            # release/dev images depend on base layers that are published to GHCR
            docker pull --platform linux/<< parameters.arch >> ghcr.io/datasqrl/duckdb-extensions:$DUCKDB_EXTENSIONS_TAG
            docker pull --platform linux/<< parameters.arch >> ghcr.io/datasqrl/sqrl-base:$BASE_TAG

      - run:
          name: Build + push << parameters.arch >> Docker images
          command: |
            set -x

            # Push by digest only, no tag, and hand the digests to the build-images merge job,
            # so the merge combines exactly the images this pipeline built.
            DIGESTS=/tmp/workspace/digests/<< parameters.arch >>
            mkdir -p "$DIGESTS"

            build_and_push() {
              local repo="$1" ; shift
              local dockerfile="$1" ; shift
              local context="$1" ; shift
              local extra_args="$@"

              docker buildx build \
                --platform linux/<< parameters.arch >> \
                --output type=image,name=$REGISTRY/$repo,push-by-digest=true,name-canonical=true,push=true \
                --metadata-file /tmp/metadata-$repo.json \
                $extra_args \
                -f "$dockerfile" \
                "$context"

              python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' \
                /tmp/metadata-$repo.json > "$DIGESTS/$repo"
            }

            build_and_push cmd         sqrl-cli/Dockerfile                      sqrl-cli                      --build-arg IMG_REPO=ghcr.io/datasqrl --build-arg BASE_TAG=$BASE_TAG
            build_and_push sqrl-server sqrl-server/sqrl-server-vertx/Dockerfile sqrl-server/sqrl-server-vertx --build-arg IMG_REPO=ghcr.io/datasqrl --build-arg DUCKDB_EXTENSIONS_TAG=$DUCKDB_EXTENSIONS_TAG
            build_and_push core-agent  agent/Dockerfile                         .                             --build-arg SQRL_IMAGE=$REGISTRY/cmd@$(cat "$DIGESTS/cmd")

      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - digests/<< parameters.arch >>

  build-images:
    executor: default-machine

    steps:
      - checkout
      - skip-if-docs-only
      - determine-version
      - skip-unpublished-images
      - attach_workspace:
          at: /tmp/workspace
      - setup-buildx:
          builder_name: "sqrl-builder"
          qemu: false

      - login-to-registries

      - run:
          name: Merge multi-arch Docker images
          command: |
            set -x

            merge_manifests() {
              local repo="$1"

              # Mirror releases to GHCR alongside Docker Hub so downstream can pull
              # without hitting Docker Hub rate limits.
              local tags=(-t $REGISTRY/$repo:$TAG_SUFFIX)
              if [ "$IS_RELEASE" = "true" ]; then
                tags+=(-t ghcr.io/datasqrl/$repo:$TAG_SUFFIX)
              fi

              # tag :latest on release builds
              if [ "$LATEST_TAG" = "true" ]; then
                tags+=(-t $REGISTRY/$repo:latest)
                if [ "$IS_RELEASE" = "true" ]; then
                  tags+=(-t ghcr.io/datasqrl/$repo:latest)
                fi
              fi

              docker buildx imagetools create \
                "${tags[@]}" \
                $REGISTRY/$repo@$(cat /tmp/workspace/digests/amd64/$repo) \
                $REGISTRY/$repo@$(cat /tmp/workspace/digests/arm64/$repo)
            }

            merge_manifests cmd
            merge_manifests sqrl-server
            merge_manifests core-agent

  docs-test:
    # Runs the documented first-run commands verbatim against the image built for this change
    executor: default-machine
    steps:
      - checkout
      - determine-version
      - run:
          name: Login to registries
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Run documented commands
          command: |
            IMAGE="$REGISTRY/cmd:$TAG_SUFFIX"
            if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "No $IMAGE was published for this build (e.g. documentation-only change), using datasqrl/cmd:dev"
              IMAGE=datasqrl/cmd:dev
            fi
            docker pull --quiet "$IMAGE"
            python3 documentation/scripts/docs-test/run_doc_commands.py \
              --image "datasqrl/cmd=$IMAGE" \
              documentation/docs/intro/getting-started-no-key.md \
              documentation/docs/compiler.md

  docker-build-duckdb-extensions:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - compute-sha1-tags
      - setup-buildx:
          builder_name: "duckdb-builder"
      - run:
          name: Skip build if duckdb-extensions already exists
          command: |
            set +e

            if docker buildx imagetools inspect ghcr.io/datasqrl/duckdb-extensions:${DUCKDB_EXTENSIONS_TAG} \
                --format '{{json .}}' > /tmp/manifest.json 2>/dev/null; then
              echo "── Manifest for ghcr.io/datasqrl/duckdb-extensions:${DUCKDB_EXTENSIONS_TAG} ────────────────"
              cat /tmp/manifest.json | jq .
              echo "───────────────────────────────────────────────────────────────"
              echo "Tag already exists – skipping duckdb-extensions build."
              circleci step halt
            else
              echo "Tag does not exist yet – will build duckdb-extensions image."
            fi


      - run:
          name: Login to GHCR
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

      - run:
          name: Build & push ghcr.io/datasqrl/duckdb-extensions:$DUCKDB_EXTENSIONS_TAG
          command: |
            docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64 \
              --build-arg DUCKDB_JDBC_VERSION=$DUCKDB_JDBC_VERSION \
              -t ghcr.io/datasqrl/duckdb-extensions:$DUCKDB_EXTENSIONS_TAG \
              -t ghcr.io/datasqrl/duckdb-extensions:latest \
              -f Dockerfile.duckdb-extensions \
              .

  docker-build-base-image-platform:
    parameters:
      arch:
        type: enum
        enum: ["amd64", "arm64"]
      resource_class:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    steps:
      - checkout
      - compute-sha1-tags
      - setup-buildx:
          builder_name: "base-builder"
          arch: << parameters.arch >>
          qemu: false
      - skip-if-base-image-exists

      - run:
          name: Login to GHCR
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

      - run:
          name: Pull duckdb-extensions image
          command: |
            docker pull --platform linux/<< parameters.arch >> ghcr.io/datasqrl/duckdb-extensions:$DUCKDB_EXTENSIONS_TAG

      - run:
          name: Build & push ghcr.io/datasqrl/sqrl-base:$BASE_TAG-<< parameters.arch >>
          command: |
            docker buildx build \
              --push \
              --platform linux/<< parameters.arch >> \
              --build-arg IMG_REPO=ghcr.io/datasqrl \
              --build-arg DUCKDB_EXTENSIONS_TAG=$DUCKDB_EXTENSIONS_TAG \
              -t ghcr.io/datasqrl/sqrl-base:$BASE_TAG-<< parameters.arch >> \
              -f sqrl-cli/Dockerfile.base \
              sqrl-cli

  docker-build-base-image:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - compute-sha1-tags
      - setup-buildx:
          builder_name: "base-builder"
          qemu: false
      - skip-if-base-image-exists

      - run:
          name: Login to GHCR
          command: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

      - run:
          name: Merge ghcr.io/datasqrl/sqrl-base:$BASE_TAG manifest
          command: |
            docker buildx imagetools create \
              -t ghcr.io/datasqrl/sqrl-base:$BASE_TAG \
              -t ghcr.io/datasqrl/sqrl-base:latest \
              ghcr.io/datasqrl/sqrl-base:$BASE_TAG-amd64 \
              ghcr.io/datasqrl/sqrl-base:$BASE_TAG-arm64

  docker-build-mcp-inspector:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - compute-mcp-tag
      - setup-buildx:
          builder_name: "mcp-builder"
      - run:
          name: Skip build if MCP inspector already exists
          command: |
            set +e

            if docker buildx imagetools inspect datasqrl/mcp-inspector:${MCP_TAG} \
                --format '{{json .}}' > /tmp/manifest.json 2>/dev/null; then
              echo "── Manifest for datasqrl/mcp-inspector:${MCP_TAG} ────────────────"
              cat /tmp/manifest.json | jq .
              echo "───────────────────────────────────────────────────────────────"
              echo "Tag already exists – skipping MCP inspector build."
              circleci step halt
            else
              echo "Tag does not exist yet – will build MCP inspector image."
            fi


      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - run:
          name: Build & push datasqrl/mcp-inspector:$MCP_TAG
          command: |
            docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64 \
              -t datasqrl/mcp-inspector:$MCP_TAG \
              -t datasqrl/mcp-inspector:latest \
              -f Dockerfile.mcp-inspector \
              .

workflows:
  ci:
    jobs:
      - docker-build-duckdb-extensions:
          <<: *job-defaults
      - docker-build-base-image-platform:
          <<: *job-defaults
          name: docker-build-base-image-amd64
          arch: amd64
          resource_class: large
          requires:
            - docker-build-duckdb-extensions
      - docker-build-base-image-platform:
          <<: *job-defaults
          name: docker-build-base-image-arm64
          arch: arm64
          resource_class: arm.large
          requires:
            - docker-build-duckdb-extensions
      - docker-build-base-image:
          <<: *job-defaults
          requires:
            - docker-build-base-image-amd64
            - docker-build-base-image-arm64
      - docker-build-mcp-inspector:
          <<: *job-defaults
      - download-maven-dependencies:
          <<: *job-defaults
      - container-e2e-test:
          <<: *job-defaults
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
          requires:
            - download-maven-dependencies
            - docker-build-base-image
            - docker-build-mcp-inspector
      - integration-tests:
          <<: *job-defaults
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
          matrix:
            parameters:
              test_sharding_total:  [2]
              test_sharding_index: [0, 1]
          requires:
            - download-maven-dependencies
      - build-images-platform:
          <<: *job-defaults
          name: build-images-amd64
          arch: amd64
          resource_class: large
          requires:
            - download-maven-dependencies
            - docker-build-duckdb-extensions
            - docker-build-base-image
      - build-images-platform:
          <<: *job-defaults
          name: build-images-arm64
          arch: arm64
          resource_class: arm.large
          requires:
            - download-maven-dependencies
            - docker-build-duckdb-extensions
            - docker-build-base-image
      - build-images:
          <<: *job-defaults
          requires:
            - build-images-amd64
            - build-images-arm64
      - docs-test:
          <<: *job-defaults
          requires:
            - build-images
      - deploy:
          <<: *job-defaults
          requires:
            - download-maven-dependencies
      - unit-tests:
          <<: *job-defaults
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/
          requires:
            - download-maven-dependencies
