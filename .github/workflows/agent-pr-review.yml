name: Agent PR Review

on:
  pull_request_target:
    types: [ labeled ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    # pull_request_target runs with secrets and this agent checks out the PR head and runs a
    # shell-capable agent on it. Never run it automatically: a maintainer reads the PR first and
    # applies the `agent-review` label (needs triage access).
    if: github.event.label.name == 'agent-review'
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Review
        # Third-party action pinned to a commit older than the 14-day supply-chain cooldown.
        # Its own nested actions (checkout, setup-python, setup-uv, upload-artifact) are still tag
        # references upstream, so this pin does not freeze everything that runs.
        uses: OpenHands/extensions/plugins/pr-review@d008b81c44ae4d56d319e3b8f28ca35fc40aacbc # main, 2026-10-07
        with:
          llm-model: openai/gpt-5.6-terra
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
