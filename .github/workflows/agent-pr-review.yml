name: Agent PR Review

on:
  pull_request_target:
    types: [ opened, ready_for_review, labeled ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    # pull_request_target runs with secrets even for fork PRs, and this agent reads the PR's
    # untrusted text. Run it automatically only for branches in this repo; a fork PR runs only
    # after a maintainer reads it and applies the `agent-review` label (needs triage access).
    if: |
      (
        github.event.pull_request.head.repo.full_name == github.repository
        && (
          (github.event.action == 'opened' && github.event.pull_request.draft == false)
          || github.event.action == 'ready_for_review'
        )
      )
      || github.event.label.name == 'agent-review'
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Review
        # Third-party action: pinned to a fixed commit, not the moving main branch.
        uses: OpenHands/extensions/plugins/pr-review@60f8f85c253314c7d815adf96ff5a7d41376ddcc # main as of 2026-11-03
        with:
          llm-model: openai/gpt-5.6-terra
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
