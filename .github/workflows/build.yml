name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has-code: ${{ steps.filter.outputs.has-code }}
      has-docs: ${{ steps.filter.outputs.has-docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect change scopes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" 2>/dev/null || echo "FORCE_BUILD")

          echo "has-code=$(echo "$CHANGED" | grep -qv '^documentation/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has-docs=$(echo "$CHANGED" | grep -q '^documentation/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  documentation:
    needs: check-changes
    if: needs.check-changes.outputs.has-docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Checkout stdlib-docs at the Flink SQL Runner version
        run: documentation/scripts/checkout-stdlib-docs.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: documentation/package-lock.json

      - name: Install dependencies
        working-directory: documentation
        run: npm install

      - name: Typecheck
        working-directory: documentation
        run: npm run typecheck

      - name: Check docs and blog front matter
        working-directory: documentation
        run: npm run check-front-matter

      # Build the docs versioned as deploy.yml does, so that a link from the unversioned pages
      # (homepage, blog) to a docs page the latest release does not have fails here, not on deploy.
      # Releases before 0.12 predate the current site structure and are not checked.
      - name: Fetch release branches
        run: git fetch --no-tags --depth 1 origin '+refs/heads/release-*:refs/remotes/origin/release-*'

      - name: Prepare versioned docs
        env:
          FIRST_VERSIONED_ZERO_MINOR: 12
        run: documentation/scripts/prepare-versioned-docs.sh

      - name: Build Docusaurus site
        working-directory: documentation
        run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CircleCI checks are enforced by the repository ruleset"
