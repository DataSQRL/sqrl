name: Deploy Docusaurus to GitHub Pages

# The site is always built from main. The docs are versioned, taking the docs of each major version
# from its latest release branch (see documentation/scripts/prepare-versioned-docs.sh). Pushes to a
# release branch therefore redeploy the site so documentation fixes on that branch get published.
on:
  push:
    branches:
      - main
      - docsUpdate
      - 'release-*'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name == 'docsUpdate' && 'docsUpdate' || github.event.repository.default_branch }}
          persist-credentials: false # we will use a deploy token instead
          submodules: false

      - name: Checkout stdlib-docs at the Flink SQL Runner version
        run: documentation/scripts/checkout-stdlib-docs.sh

      - name: Fetch release branches
        run: git fetch --no-tags --depth 1 origin '+refs/heads/release-*:refs/remotes/origin/release-*'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Prepare versioned docs
        run: documentation/scripts/prepare-versioned-docs.sh

      - name: Install dependencies
        working-directory: documentation
        run: npm ci

      - name: Build Docusaurus site
        working-directory: documentation
        run: npm run build

      - name: Create CNAME file
        run: echo 'docs.datasqrl.com' > documentation/build/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation/build
