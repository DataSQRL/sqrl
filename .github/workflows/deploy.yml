name: Deploy Docusaurus to GitHub Pages

# The site is always built from main, which also builds every major version from its latest
# release branch and serves the latest one at the root (see documentation/scripts/build-versioned-site.sh). Pushes to a release branch
# therefore redeploy the whole site so documentation fixes on that branch get published.
on:
  push:
    branches:
      - main
      - docsUpdate
      - 'release-*'
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name == 'docsUpdate' && 'docsUpdate' || github.event.repository.default_branch }}
          persist-credentials: false # we will use a deploy token instead
          submodules: false

      - name: Init submodules and sparse checkout
        run: |
          git submodule update --init --depth 1
          cd documentation/docs/stdlib-docs
          git sparse-checkout init --cone
          git sparse-checkout set stdlib-docs
          git checkout main
          git pull --ff-only origin main

      - name: Fetch release branches
        run: git fetch --no-tags --depth 1 origin '+refs/heads/release-*:refs/remotes/origin/release-*'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build versioned Docusaurus site
        run: documentation/scripts/build-versioned-site.sh

      - name: Create CNAME file
        run: echo 'docs.datasqrl.com' > documentation/build/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documentation/build
