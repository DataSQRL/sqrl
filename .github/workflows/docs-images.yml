name: Documented images

# Verifies that every DataSQRL image referenced in the README and docs can be pulled
# anonymously, the way a first-time user would pull it.
on:
  pull_request:
    paths:
      - 'README.md'
      - 'agent/README.md'
      - 'documentation/docs/**'
      - 'documentation/src/pages/**'
      - 'documentation/scripts/docs-test/**'
      - 'documentation/scripts/checkout-stdlib-docs.sh'
      - '.github/workflows/docs-images.yml'
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The stdlib docs are part of the published docs, check them out like the docs build does
      - name: Checkout stdlib-docs at the Flink SQL Runner version
        run: documentation/scripts/checkout-stdlib-docs.sh

      - name: Check that documented images can be pulled anonymously
        run: documentation/scripts/docs-test/check-doc-images.sh
