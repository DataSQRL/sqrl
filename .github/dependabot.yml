# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Supply-chain policy: every entry only takes releases that have been public for 14 days (cooldown).
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule: { interval: "weekly", time: "10:00" }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"
    directories: ["/", "/sqrl-cli"]
    schedule: { interval: "weekly", time: "10:00" }
    cooldown: { default-days: 14 }

  - package-ecosystem: "npm"
    directory: "/documentation"
    schedule: { interval: "monthly", time: "10:00" }
    cooldown: { default-days: 14 }
    groups:
      docusaurus:
        patterns: ["@docusaurus/*"]

  # Keeps the actions pinned to commit SHAs in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", time: "10:00" }
    cooldown: { default-days: 14 }
