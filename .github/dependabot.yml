# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven"
    # Supply-chain policy: only take releases that have been public for 14 days.
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"

    # Supply-chain policy: only take releases that have been public for 14 days.

    cooldown:

      default-days: 14
    directory: "/sqrl-cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"

  - package-ecosystem: "docker"

    # Supply-chain policy: only take releases that have been public for 14 days.

    cooldown:

      default-days: 14
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"

  - package-ecosystem: "npm"

    # Supply-chain policy: only take releases that have been public for 14 days.

    cooldown:

      default-days: 14
    directory: "/documentation"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"

  # Keeps the actions pinned to commit SHAs in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    # Supply-chain policy: only take releases that have been public for 14 days.
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
